# CI/CD: every push to main runs the tests, then redeploys the API on AWS EC2.
name: Test and deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test-backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install CPU PyTorch and requirements
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r backend/requirements.txt
      - name: Run backend tests
        run: python -m pytest backend/tests -q

  test-mobile:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm test

  deploy:
    needs: [test-backend, test-mobile]
    # Skipped until the repository variable EC2_HOST (the instance's Elastic IP) is set.
    if: ${{ vars.EC2_HOST != '' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Pull and rebuild on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 30m
          script: bash ~/E-ref/deploy/deploy.sh
